name: Release

on:
  workflow_call:
    inputs:
      head_branch:
        required: true
        type: string
      base_ref:
        required: false
        type: string
      repo:
        required: true
        type: string
      sha:
        required: true
        type: string
    secrets:
      RELEASE_GITHUB_TOKEN:
        required: true

jobs:
  release:
    outputs:
      version: ${{ steps.compute_version.outputs.version }}
    # Only run when the CI workflow invoked this workflow call and the repo and branch match
    if: ${{ github.repository == inputs.repo && (inputs.head_branch == 'main' || inputs.head_branch == 'develop' || inputs.base_ref == 'main' || inputs.base_ref == 'develop') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ inputs.sha }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        run: |
          # Install all dependencies including dev so python-semantic-release is available
          uv sync --dev

      - name: Configure Git for release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Show invocation inputs
        run: |
          echo "GITHUB_EVENT_NAME=${{ github.event_name }}"
          echo "HEAD_BRANCH=${{ inputs.head_branch }}"
          echo "BASE_REF=${{ inputs.base_ref }}"
          echo "SHA=${{ inputs.sha }}"

      - name: Prepare branch for PR dry-run
        if: ${{ inputs.base_ref != '' }}
        run: |
          echo "[release] PR detected (base_ref=${{ inputs.base_ref }}). Preparing local branch '${{ inputs.head_branch }}' for dry-run"
          # Fetch all remote branches so we can create a local branch name
          git fetch --no-tags origin '+refs/heads/*:refs/remotes/origin/*' || true
          # Create or move a local branch to point at the provided SHA, then check it out
          git branch -f "${{ inputs.head_branch }}" "${{ inputs.sha }}"
          git checkout "${{ inputs.head_branch }}"

      - name: Dry-run semantic release — Print tag (PRs only)
        if: ${{ inputs.base_ref != '' }}
        run: |
          echo "[release] PR detected (base_ref=${{ inputs.base_ref }}). Running dry-run (print tag)"
          # If the PR targets develop, run dry-run with the 'dev' prerelease token
          if [ "${{ inputs.base_ref }}" = "develop" ]; then
            echo "[release] Target is 'develop' — using prerelease token 'dev' for dry-run"
            uv run semantic-release version --no-commit --no-tag --no-changelog --no-push --no-vcs-release --skip-build --print-tag --as-prerelease --prerelease-token dev || true
          else
            uv run semantic-release version --no-commit --no-tag --no-changelog --no-push --no-vcs-release --skip-build --print-tag || true
          fi

      - name: Checkout branch for publish
        if: ${{ inputs.base_ref == '' && (inputs.head_branch == 'main' || inputs.head_branch == 'develop') }}
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ inputs.head_branch }}

      - name: Ensure branch is checked out for version computation
        if: ${{ inputs.base_ref == '' && (inputs.head_branch == 'main' || inputs.head_branch == 'develop') }}
        run: |
          echo "[release] Ensuring branch '${{ inputs.head_branch }}' is checked out for version computation"
          # Fetch all remote branches to ensure refs are available
          git fetch --no-tags origin '+refs/heads/*:refs/remotes/origin/*' || true
          # Force checkout the branch at the provided SHA
          git checkout -B "${{ inputs.head_branch }}" "${{ inputs.sha }}" || git checkout "${{ inputs.head_branch }}" || true
          echo "Current branch: $(git branch --show-current)"
          echo "Recent commits:"
          git log --oneline -n 5
          echo "Tags:"
          git tag --list | tail -10

      - name: Compute release version
        id: compute_version
        run: |
          echo "[release] Computing release version (for tagging images)"
          ver=$(uv run semantic-release version --print)
          echo "Computed version: $ver"
          echo "version=$ver" >> "$GITHUB_OUTPUT"

      - name: Python Semantic Release — Publish
        if: ${{ inputs.base_ref == '' && (inputs.head_branch == 'main' || inputs.head_branch == 'develop') }}
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_GITHUB_TOKEN }}
        run: |
          # Run the semantic release publish command via uv
          uv run semantic-release publish

  call-cd:
    name: Call CD workflow
    needs: release
    uses: ./.github/workflows/cd.yml
    with:
      head_branch: ${{ inputs.head_branch }}
      base_ref: ${{ inputs.base_ref }}
      repo: ${{ inputs.repo }}
      sha: ${{ inputs.sha }}
      version: ${{ needs.release.outputs.version }}
    secrets:
      ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
      ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
      RELEASE_GITHUB_TOKEN: ${{ secrets.RELEASE_GITHUB_TOKEN }}
