name: Release

on:
  workflow_call:
    inputs:
      head_branch:
        required: true
        type: string
      base_ref:
        required: false
        type: string
      is_pr:
        required: false
        type: boolean
      repo:
        required: true
        type: string
      sha:
        required: true
        type: string
      token_source:
        required: false
        type: string
    secrets:
      RELEASE_GITHUB_TOKEN:
        required: true
  push:
    branches: [ main, develop ]

jobs:
  release:
    outputs:
      version: ${{ steps.compute_version.outputs.version }}
      head_branch: ${{ steps.set_release_outputs.outputs.head_branch }}
      base_ref: ${{ steps.set_release_outputs.outputs.base_ref }}
      repo: ${{ steps.set_release_outputs.outputs.repo }}
      sha: ${{ steps.set_release_outputs.outputs.sha }}
    runs-on: ubuntu-latest
    env:
      # When invoked via workflow_call, prefer the provided inputs; otherwise derive from push context
      # HEAD_BRANCH resolution: prefer workflow_call input, then pull_request context, then ref_name
      HEAD_BRANCH: ${{ github.event_name == 'workflow_call' && inputs.head_branch || github.event.pull_request.head.ref || github.ref_name }}
      # BASE_REF resolution: prefer workflow_call input, then pull_request.base.ref, otherwise empty
      BASE_REF: ${{ github.event_name == 'workflow_call' && inputs.base_ref || github.event.pull_request.base.ref || '' }}
      REPO_INPUT: ${{ github.event_name == 'workflow_call' && inputs.repo || github.repository }}
      SHA_INPUT: ${{ github.event_name == 'workflow_call' && inputs.sha || github.sha }}
      # Caller can explicitly indicate PR context; otherwise derive from event_name
      IS_PR: ${{ github.event_name == 'workflow_call' && inputs.is_pr || github.event_name == 'pull_request' }}
      # Token source forwarded from CI: 'app', 'workflow', or 'none'
      TOKEN_SOURCE: ${{ github.event_name == 'workflow_call' && inputs.token_source || 'unknown' }}
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0  # Critical: semantic-release needs full history
          ref: ${{ env.SHA_INPUT }}
          token: ${{ secrets.RELEASE_GITHUB_TOKEN != '' && secrets.RELEASE_GITHUB_TOKEN || github.token }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        run: |
          # Install all dependencies including dev so python-semantic-release is available
          uv sync --dev

      - name: Configure Git for release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Show invocation inputs
        run: |
          echo "GITHUB_EVENT_NAME=${{ github.event_name }}"
          echo "HEAD_BRANCH=${{ env.HEAD_BRANCH }}"
          echo "BASE_REF=${{ env.BASE_REF }}"
          echo "SHA=${{ env.SHA_INPUT }}"
          echo "Current branch: $(git branch --show-current)"
          echo "Current commit: $(git rev-parse HEAD)"

      - name: Verify which token source we're using (no secrets printed)
        run: |
          echo "TOKEN_SOURCE=${{ env.TOKEN_SOURCE }}"
          if [ "${{ env.TOKEN_SOURCE }}" = "app" ]; then
            echo "Using GitHub App installation token (provided by CI)."
          elif [ "${{ env.TOKEN_SOURCE }}" = "workflow" ]; then
            echo "Using workflow token or PAT fallback (RELEASE_GITHUB_TOKEN)."
          elif [ "${{ env.TOKEN_SOURCE }}" = "none" ]; then
            echo "No token forwarded (PR or explicit none). Dry-run behavior expected."
          else
            echo "Token source unknown or not provided; runtime will choose available token (RELEASE_GITHUB_TOKEN or GITHUB_TOKEN)."
          fi

      - name: Prepare branch for semantic-release
        run: |
          # Fetch all remote branches and tags
          git fetch --all --tags

          # Ensure we're on the correct branch
          if [ "$(git branch --show-current)" != "${{ env.HEAD_BRANCH }}" ]; then
            echo "Creating/checking out branch '${{ env.HEAD_BRANCH }}' at SHA ${{ env.SHA_INPUT }}"
            git checkout -B "${{ env.HEAD_BRANCH }}" "${{ env.SHA_INPUT }}"
          fi

          echo "Current branch: $(git branch --show-current)"
          echo "Recent commits:"
          git log --oneline -n 5
          echo "Recent tags:"
          git tag --list --sort=-version:refname | head -10

      # Token creation and origin configuration are handled in CI and passed in as RELEASE_GITHUB_TOKEN
      # PR dry-run: Just print what version would be created
      - name: Dry-run semantic release — Print tag (PRs only)
        if: ${{ env.IS_PR == 'true' || env.BASE_REF != '' }}
        run: |
          echo "[release] PR detected (is_pr=${{ env.IS_PR }}, base_ref=${{ env.BASE_REF }}). Running dry-run (print tag)"

          # Determine if we need prerelease mode
          # semantic-release is configured in pyproject.toml to mark 'develop' as prerelease
          uv run semantic-release version --print || echo "Dry-run completed"

      # Actual release: Compute version and publish
      - name: Compute and publish release
        id: compute_version
        if: ${{ env.BASE_REF == '' && (env.HEAD_BRANCH == 'main' || env.HEAD_BRANCH == 'develop') }}
        env:
          # Expose RELEASE_GITHUB_TOKEN for use in the script; GH_APP_TOKEN (if created) will be available via $GH_APP_TOKEN
          RELEASE_GITHUB_TOKEN: ${{ secrets.RELEASE_GITHUB_TOKEN }}
        run: |
          echo "[release] Publishing release for branch '${{ env.HEAD_BRANCH }}'"

          # Prefer app installation token if available (set in GH_APP_TOKEN), otherwise prefer RELEASE_GITHUB_TOKEN, otherwise rely on the workflow GITHUB_TOKEN
          if [ -n "${GH_APP_TOKEN:-}" ]; then
            echo "Using GH_APP_TOKEN for git/auth"
            export GH_TOKEN="$GH_APP_TOKEN"
            export GITHUB_TOKEN="$GH_APP_TOKEN"
          elif [ -n "${RELEASE_GITHUB_TOKEN:-}" ]; then
            echo "Using RELEASE_GITHUB_TOKEN from secrets for git/auth"
            export GH_TOKEN="$RELEASE_GITHUB_TOKEN"
            export GITHUB_TOKEN="$RELEASE_GITHUB_TOKEN"
          else
            echo "No RELEASE_GITHUB_TOKEN or GH_APP_TOKEN found; using default GITHUB_TOKEN from actions context"
          fi

          # Runtime token selection confirmation (no secrets printed)
          if [ -n "${GH_APP_TOKEN:-}" ]; then
            echo "Selected token source: app"
          elif [ -n "${RELEASE_GITHUB_TOKEN:-}" ]; then
            echo "Selected token source: workflow"
          else
            echo "Selected token source: none (using default workflow GITHUB_TOKEN)"
          fi

          # For develop branch, use prerelease mode; for main, use standard release
          # semantic-release branch settings in pyproject.toml determine prerelease behavior
          echo "[release] Invoking semantic-release publish (configuration controls prerelease)"
          uv run semantic-release publish
          # Get the version that was just published
          ver=$(uv run semantic-release version --print)

          echo "Published version: $ver"
          echo "version=$ver" >> "$GITHUB_OUTPUT"

          # Verify the tag was created
          echo "Verifying tags:"
          git tag --list --sort=-version:refname | head -5

      - name: "Debug: verify local and remote tags (no secrets printed)"
        if: ${{ always() }}
        run: |
          echo "Local tags (recent):"
          git tag --list --sort=-version:refname | head -10 || true
          echo "Remote tags (origin, recent):"
          git ls-remote --tags origin | tail -20 || true

      - name: Set release job outputs
        id: set_release_outputs
        run: |
          echo "head_branch=$HEAD_BRANCH" >> "$GITHUB_OUTPUT"
          echo "base_ref=$BASE_REF" >> "$GITHUB_OUTPUT"
          echo "repo=$REPO_INPUT" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA_INPUT" >> "$GITHUB_OUTPUT"

  call-cd:
    name: Call CD workflow
    needs: release
    if: ${{ needs.release.outputs.version != '' }}
    uses: ./.github/workflows/cd.yml
    with:
      head_branch: ${{ needs.release.outputs.head_branch }}
      base_ref: ${{ needs.release.outputs.base_ref }}
      repo: ${{ needs.release.outputs.repo }}
      sha: ${{ needs.release.outputs.sha }}
      version: ${{ needs.release.outputs.version }}
    secrets:
      ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
      ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
      RELEASE_GITHUB_TOKEN: ${{ secrets.RELEASE_GITHUB_TOKEN }}
