name: Release

on:
  workflow_call:
    inputs:
      head_branch:
        required: true
        type: string
      base_ref:
        required: false
        type: string
      repo:
        required: true
        type: string
      sha:
        required: true
        type: string
    secrets:
      RELEASE_GITHUB_TOKEN:
        required: true

jobs:
  release:
    outputs:
      version: ${{ steps.compute_version.outputs.version }}
    # Only run when the CI workflow invoked this workflow call and the repo and branch match
    if: ${{ github.repository == inputs.repo && (inputs.head_branch == 'main' || inputs.head_branch == 'develop' || inputs.base_ref == 'main' || inputs.base_ref == 'develop') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0  # Critical: semantic-release needs full history
          ref: ${{ inputs.sha }}
          token: ${{ secrets.RELEASE_GITHUB_TOKEN != '' && secrets.RELEASE_GITHUB_TOKEN || github.token }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        run: |
          # Install all dependencies including dev so python-semantic-release is available
          uv sync --dev

      - name: Configure Git for release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Show invocation inputs
        run: |
          echo "GITHUB_EVENT_NAME=${{ github.event_name }}"
          echo "HEAD_BRANCH=${{ inputs.head_branch }}"
          echo "BASE_REF=${{ inputs.base_ref }}"
          echo "SHA=${{ inputs.sha }}"
          echo "Current branch: $(git branch --show-current)"
          echo "Current commit: $(git rev-parse HEAD)"

      - name: Prepare branch for semantic-release
        run: |
          # Fetch all remote branches and tags
          git fetch --all --tags

          # Ensure we're on the correct branch
          if [ "$(git branch --show-current)" != "${{ inputs.head_branch }}" ]; then
            echo "Creating/checking out branch '${{ inputs.head_branch }}' at SHA ${{ inputs.sha }}"
            git checkout -B "${{ inputs.head_branch }}" "${{ inputs.sha }}"
          fi

          echo "Current branch: $(git branch --show-current)"
          echo "Recent commits:"
          git log --oneline -n 5
          echo "Recent tags:"
          git tag --list --sort=-version:refname | head -10

      # PR dry-run: Just print what version would be created
      - name: Dry-run semantic release — Print tag (PRs only)
        if: ${{ inputs.base_ref != '' }}
        run: |
          echo "[release] PR detected (base_ref=${{ inputs.base_ref }}). Running dry-run (print tag)"

          # Determine if we need prerelease mode
          if [ "${{ inputs.base_ref }}" = "develop" ]; then
            echo "[release] Target is 'develop' — using prerelease token 'dev' for dry-run"
            uv run semantic-release version --print --prerelease --prerelease-token dev || echo "Dry-run completed"
          else
            echo "[release] Target is 'main' — running standard version dry-run"
            uv run semantic-release version --print || echo "Dry-run completed"
          fi

      # Actual release: Compute version and publish
      - name: Compute and publish release
        id: compute_version
        if: ${{ inputs.base_ref == '' && (inputs.head_branch == 'main' || inputs.head_branch == 'develop') }}
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.RELEASE_GITHUB_TOKEN }}
        run: |
          echo "[release] Publishing release for branch '${{ inputs.head_branch }}'"

          # For develop branch, use prerelease mode; for main, use standard release
          if [ "${{ inputs.head_branch }}" = "develop" ]; then
            echo "[release] Branch is 'develop' — publishing as prerelease with token 'dev'"
            # Publish the release with prerelease mode
            uv run semantic-release publish --prerelease --prerelease-token dev
            # Get the version that was just published
            ver=$(uv run semantic-release version --print --prerelease --prerelease-token dev)
          else
            echo "[release] Branch is 'main' — publishing as standard release"
            # Publish the release
            uv run semantic-release publish
            # Get the version that was just published
            ver=$(uv run semantic-release version --print)
          fi

          echo "Published version: $ver"
          echo "version=$ver" >> "$GITHUB_OUTPUT"

          # Verify the tag was created
          echo "Verifying tags:"
          git tag --list --sort=-version:refname | head -5

  call-cd:
    name: Call CD workflow
    needs: release
    uses: ./.github/workflows/cd.yml
    with:
      head_branch: ${{ inputs.head_branch }}
      base_ref: ${{ inputs.base_ref }}
      repo: ${{ inputs.repo }}
      sha: ${{ inputs.sha }}
      version: ${{ needs.release.outputs.version }}
    secrets:
      ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
      ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
      RELEASE_GITHUB_TOKEN: ${{ secrets.RELEASE_GITHUB_TOKEN }}
