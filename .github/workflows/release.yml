name: Release

on:
  workflow_call:
    inputs:
      head_branch:
        required: true
        type: string
      base_ref:
        required: false
        type: string
      is_pr:
        required: false
        type: boolean
      repo:
        required: true
        type: string
      sha:
        required: true
        type: string
    secrets:
      APP_ID:
        required: true
      APP_PRIVATE_KEY_B64:
        required: true

permissions:
  contents: write
  packages: write

jobs:
  release:
    if: ${{ inputs.head_branch == 'main' }}
    outputs:
      version: ${{ steps.compute_version.outputs.version }}
      head_branch: ${{ inputs.head_branch }}
      base_ref: ${{ inputs.base_ref }}
      repo: ${{ inputs.repo }}
      sha: ${{ inputs.sha }}
      gh_app_token: ${{ steps.create_app_token.outputs.token }}
    runs-on: ubuntu-latest
    steps:
      - name: Decode GitHub App private key
        id: decode_key
        run: |
          decoded_key=$(printf '%s' "${{ secrets.APP_PRIVATE_KEY_B64 }}" | base64 -d)
          echo "private_key<<EOF" >> $GITHUB_OUTPUT
          echo "$decoded_key" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create GitHub App token
        id: create_app_token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ steps.decode_key.outputs.private_key }}
          repositories: ${{ github.event.repository.name }}

      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ inputs.sha }}
          token: ${{ steps.create_app_token.outputs.token }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        run: uv sync --dev

      - name: Configure Git
        run: |
          git config user.name "CI-Semantic-Release-Bot[bot]"
          git config user.email "CI-Semantic-Release-Bot[bot]@users.noreply.github.com"

      - name: Prepare branch for semantic-release
        run: |
          git fetch --all --tags
          if [ "$(git branch --show-current)" != "${{ inputs.head_branch }}" ]; then
            git checkout -B "${{ inputs.head_branch }}" "${{ inputs.sha }}"
          fi

      - name: Dry-run semantic release (PRs only)
        if: ${{ inputs.is_pr == true || inputs.base_ref != '' }}
        run: |
          echo "PR detected - running dry-run"
          uv run semantic-release version --print || echo "Dry-run completed"

      - name: Compute and publish release
        id: compute_version
        if: ${{ inputs.base_ref == '' && (inputs.head_branch == 'main' || inputs.head_branch == 'develop') }}
        env:
          GH_TOKEN: ${{ steps.create_app_token.outputs.token }}
        run: |
          echo "Publishing release for branch '${{ inputs.head_branch }}'"

          # Configure authenticated remote
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${{ inputs.repo }}.git"

          # Run semantic-release with explicit token
          GH_TOKEN="${GH_TOKEN}" uv run semantic-release version --changelog
          GH_TOKEN="${GH_TOKEN}" uv run semantic-release publish

          # Capture version
          ver=$(uv run semantic-release version --print || echo "")
          echo "version=$ver" >> "$GITHUB_OUTPUT"
          echo "Published version: $ver"

  call-cd:
    name: Call CD workflow
    needs: release
    if: ${{ needs.release.outputs.version != '' && inputs.head_branch == 'main' }}
    uses: ./.github/workflows/cd.yml
    with:
      head_branch: ${{ needs.release.outputs.head_branch }}
      base_ref: ${{ needs.release.outputs.base_ref }}
      repo: ${{ needs.release.outputs.repo }}
      sha: ${{ needs.release.outputs.sha }}
      version: ${{ needs.release.outputs.version }}
    secrets:
      GH_APP_TOKEN: ${{ needs.release.outputs.gh_app_token }}
      APP_ID: ${{ secrets.APP_ID }}
      APP_PRIVATE_KEY_B64: ${{ secrets.APP_PRIVATE_KEY_B64 }}
      RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
