name: CD - Build & Push Docker Image

on:
  workflow_call:
    inputs:
      head_branch:
        required: true
        type: string
      base_ref:
        required: false
        type: string
      repo:
        required: true
        type: string
      sha:
        required: true
        type: string
      version:
        required: false
        type: string
    secrets:
      ACR_USERNAME:
        required: false
      ACR_PASSWORD:
        required: false
      GH_APP_TOKEN:
        required: false
      APP_ID:
        required: false
      APP_PRIVATE_KEY_B64:
        required: false

jobs:
  prepare-tags:
    name: Prepare tags
    runs-on: ubuntu-latest
    permissions:
      contents: read
    if: ${{ inputs.base_ref == '' && (inputs.head_branch == 'main' || inputs.head_branch == 'develop') }}
    outputs:
      tags: ${{ steps.prepare_tags.outputs.tags }}
      should_push: ${{ steps.prepare_tags.outputs.should_push }}
    steps:
      - name: Prepare tags
        id: prepare_tags
        run: |
          repo_full="ghcr.io/${{ inputs.repo }}"
          repo="$(echo "$repo_full" | tr '[:upper:]' '[:lower:]')"
          ver="${{ inputs.version }}"
          head_branch="${{ inputs.head_branch }}"
          short="${{ inputs.sha }}"
          short="${short:0:7}"

          if [ "$head_branch" = "main" ]; then
            if [ -n "$ver" ]; then
              tags="$repo:latest"
            else
              tags="$repo:dev-$short"
            fi
          elif [ "$head_branch" = "develop" ]; then
            if [ -n "$ver" ]; then
              tags="$repo:v$ver"
            else
              tags="$repo:dev-$short"
            fi
          else
            echo "should_push=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "tags=$tags" >> "$GITHUB_OUTPUT"
          echo "should_push=true" >> "$GITHUB_OUTPUT"
          echo "Prepared tags: $tags"

  build-and-push-ghcr:
    name: Build & push to GHCR
    needs: prepare-tags
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    if: ${{ needs.prepare-tags.outputs.should_push == 'true' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Check if App token creation is needed
        id: check_app_token
        run: |
          if [ -z "${{ secrets.GH_APP_TOKEN }}" ] && [ -n "${{ secrets.APP_ID }}" ] && [ -n "${{ secrets.APP_PRIVATE_KEY_B64 }}" ]; then
            echo "create_token=true" >> "$GITHUB_OUTPUT"
          else
            echo "create_token=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Decode GitHub App private key
        id: decode_key
        if: steps.check_app_token.outputs.create_token == 'true'
        run: |
          decoded_key=$(printf '%s' "${{ secrets.APP_PRIVATE_KEY_B64 }}" | base64 -d)
          echo "private_key<<EOF" >> $GITHUB_OUTPUT
          echo "$decoded_key" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create GitHub App token
        id: create_app_token
        if: steps.check_app_token.outputs.create_token == 'true'
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ steps.decode_key.outputs.private_key }}
          repositories: ${{ github.event.repository.name }}

      - name: Determine authentication token
        id: determine_token
        run: |
          if [ -n "${{ secrets.GH_APP_TOKEN }}" ]; then
            echo "token_source=gh_app_token_forwarded" >> "$GITHUB_OUTPUT"
            echo "token=${{ secrets.GH_APP_TOKEN }}" >> "$GITHUB_OUTPUT"
          elif [ -n "${{ steps.create_app_token.outputs.token }}" ]; then
            echo "token_source=gh_app_token_created" >> "$GITHUB_OUTPUT"
            echo "token=${{ steps.create_app_token.outputs.token }}" >> "$GITHUB_OUTPUT"
          else
            echo "token_source=github_token_fallback" >> "$GITHUB_OUTPUT"
            echo "token=${{ secrets.GITHUB_TOKEN }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Log authentication method
        run: |
          echo "🔐 Authentication method: ${{ steps.determine_token.outputs.token_source }}"
          case "${{ steps.determine_token.outputs.token_source }}" in
            gh_app_token_forwarded)
              echo "Using GitHub App token forwarded from release workflow"
              ;;
            gh_app_token_created)
              echo "Using GitHub App token created in CD workflow"
              ;;
            github_token_fallback)
              echo "⚠️  Using fallback GITHUB_TOKEN (App token unavailable)"
              ;;
          esac

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ steps.determine_token.outputs.token }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ needs.prepare-tags.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Image push summary
        run: |
          echo "✅ Image pushed successfully using: ${{ steps.determine_token.outputs.token_source }}"
          echo "Tags: ${{ needs.prepare-tags.outputs.tags }}"
          echo "Branch: ${{ inputs.head_branch }}"
          echo "Version: ${{ inputs.version }}"
