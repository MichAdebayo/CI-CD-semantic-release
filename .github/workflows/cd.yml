name: CD - Build & Push Docker Image

on:
  workflow_call:
    inputs:
      head_branch:
        required: true
        type: string
      base_ref:
        required: false
        type: string
      repo:
        required: true
        type: string
      sha:
        required: true
        type: string
      version:
        required: false
        type: string
    secrets:
      ACR_USERNAME:
        required: false
      ACR_PASSWORD:
        required: false
      RELEASE_GITHUB_TOKEN:
        required: false

jobs:
  prepare-tags:
    name: Prepare tags
    runs-on: ubuntu-latest
    permissions:
      contents: read
    if: ${{ github.repository == inputs.repo && (inputs.head_branch == 'main' || inputs.head_branch == 'develop' || inputs.base_ref == 'main' || inputs.base_ref == 'develop') }}
    outputs:
      tags: ${{ steps.prepare_tags.outputs.tags }}
      labels: ${{ steps.prepare_tags.outputs.labels }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Debug - print workflow inputs and GitHub context
        run: |
          echo "--- CD prepare-tags debug: inputs & context ---"
          echo "inputs.head_branch=${{ inputs.head_branch }}"
          echo "inputs.base_ref=${{ inputs.base_ref }}"
          echo "inputs.repo=${{ inputs.repo }}"
          echo "inputs.sha=${{ inputs.sha }}"
          echo "github.repository=${{ github.repository }}"
          echo "github.ref=${{ github.ref }}"
          echo "github.event_name=${{ github.event_name }}"
          echo "github.actor=${{ github.actor }}"
          echo "-----------------------------------------------"

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ inputs.repo }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Debug - show metadata-action outputs
        if: always()
        run: |
          echo "--- metadata-action outputs ---"
          echo "meta.tags=${{ steps.meta.outputs.tags }}"
          echo "meta.labels=${{ steps.meta.outputs.labels }}"
          echo "--- parsed tags (one per line) ---"
          printf '%s' "${{ steps.meta.outputs.tags }}" | tr ',' '\n' || true
          echo "----------------------------------"

      - name: Prepare tags (prepend semantic version if provided)
        id: prepare_tags
        run: |
          ver="${{ inputs.version }}"
          repo_full="ghcr.io/${{ inputs.repo }}"
          # Lowercase image name to satisfy registry rules (owner/repo must be lowercase)
          repo="$(echo "$repo_full" | tr '[:upper:]' '[:lower:]')"
          head_branch="${{ inputs.head_branch }}"

          out=()
          case "$head_branch" in
            main)
              out+=("$repo:latest")
              ;;
            develop)
              if [ -n "$ver" ]; then
                out+=("$repo:$ver")
              else
                short="${{ inputs.sha }}"
                short="${short:0:7}"
                out+=("$repo:develop-$short")
              fi
              ;;
            *)
              echo "Skipping CD: unsupported branch '$head_branch' (no tags to prepare)"
              echo "tags=" >> "$GITHUB_OUTPUT"
              echo "labels=" >> "$GITHUB_OUTPUT"
              exit 0
              ;;
          esac

          IFS=','; tags="${out[*]}"; unset IFS
          echo "Prepared tags: $tags"
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
          # Forward labels from metadata-action so build step can reuse them
          echo "labels=${{ steps.meta.outputs.labels }}" >> "$GITHUB_OUTPUT"

  build-and-push-ghcr:
    name: Build & push to GHCR
    needs: prepare-tags
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    if: ${{ needs.prepare-tags.outputs.tags != '' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.RELEASE_GITHUB_TOKEN }}

      - name: Build and push Docker image to GHCR
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ needs.prepare-tags.outputs.tags }}
          labels: ${{ needs.prepare-tags.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Debug - verify prepared tags (sanity)
        if: always()
        run: |
          echo "--- pre-push sanity ---"
          docker --version || true
          echo "buildx info:" && docker buildx version || true
          echo "Prepared tags to push: '${{ needs.prepare-tags.outputs.tags }}'"
          echo "Note: secrets are not printed."
          echo "-------------------------"

  # previous stub preserved for callers that expect it; kept commented
