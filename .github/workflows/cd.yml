name: CD - Build & Push Docker Image

on:
  workflow_call:
    inputs:
      head_branch:
        required: true
        type: string
      base_ref:
        required: false
        type: string
      repo:
        required: true
        type: string
      sha:
        required: true
        type: string
      version:
        required: false
        type: string
    secrets:
      ACR_USERNAME:
        required: false
      ACR_PASSWORD:
        required: false
      GH_APP_TOKEN:
        required: false
      APP_ID:
        required: false
      APP_PRIVATE_KEY_B64:
        required: false

jobs:
  prepare-tags:
    name: Prepare tags
    runs-on: ubuntu-latest
    permissions:
      contents: read
    if: ${{ inputs.base_ref == '' && (inputs.head_branch == 'main' || inputs.head_branch == 'develop') }}
    outputs:
      tags: ${{ steps.prepare_tags.outputs.tags }}
      should_push: ${{ steps.prepare_tags.outputs.should_push }}
    steps:
      - name: Prepare tags
        id: prepare_tags
        run: |
          repo_full="ghcr.io/${{ inputs.repo }}"
          repo="$(echo "$repo_full" | tr '[:upper:]' '[:lower:]')"
          ver="${{ inputs.version }}"
          head_branch="${{ inputs.head_branch }}"
          short="${{ inputs.sha }}"
          short="${short:0:7}"

          if [ "$head_branch" = "main" ]; then
            if [ -n "$ver" ]; then
              tags="$repo:latest"
            else
              tags="$repo:dev-$short"
            fi
          elif [ "$head_branch" = "develop" ]; then
            if [ -n "$ver" ]; then
              tags="$repo:v$ver"
            else
              tags="$repo:dev-$short"
            fi
          else
            echo "should_push=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "tags=$tags" >> "$GITHUB_OUTPUT"
          echo "should_push=true" >> "$GITHUB_OUTPUT"
          echo "Prepared tags: $tags"

  build-and-push-ghcr:
    name: Build & push to GHCR
    needs: prepare-tags
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    if: ${{ needs.prepare-tags.outputs.should_push == 'true' }}
    env:
      APP_PRIVATE_KEY: ''
      USE_APP: ''
      PASSWORD: ''
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Determine auth method
        run: |
          if [ -n "${{ secrets.GH_APP_TOKEN }}" ]; then
            echo "USE_APP=false" >> $GITHUB_ENV
          else
            echo "USE_APP=true" >> $GITHUB_ENV
          fi

      - name: Decode GitHub App private key
        if: ${{ env.USE_APP == 'true' }}
        run: |
          printf '%s' "${{ secrets.APP_PRIVATE_KEY_B64 }}" | base64 -d > /tmp/app.pem
          echo "APP_PRIVATE_KEY<<EOF" >> $GITHUB_ENV
          cat /tmp/app.pem >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Create GitHub App token
        id: create_app_token
        if: ${{ env.USE_APP == 'true' }}
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ env.APP_PRIVATE_KEY }}
          repositories: ${{ github.event.repository.name }}

      - name: Set password
        run: |
          if [ -n "${{ secrets.GH_APP_TOKEN }}" ]; then
            echo "PASSWORD=${{ secrets.GH_APP_TOKEN }}" >> $GITHUB_ENV
          else
            echo "PASSWORD=${{ steps.create_app_token.outputs.token }}" >> $GITHUB_ENV
          fi

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ env.PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ needs.prepare-tags.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Image push summary
        run: |
          echo "✅ Image pushed successfully"
          echo "Tags: ${{ needs.prepare-tags.outputs.tags }}"
          echo "Branch: ${{ inputs.head_branch }}"
          echo "Version: ${{ inputs.version }}"
