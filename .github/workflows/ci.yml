name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

permissions:
  contents: write
  packages: write
  pull-requests: write
  id-token: write

jobs:
  checks:
    name: Lint, Typecheck, Security & Tests
    runs-on: ubuntu-latest
    env:
      APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
      APP_PRIVATE_KEY_B64: ${{ secrets.APP_PRIVATE_KEY_B64 }}
      DEPLOY_URL: ${{ secrets.DEPLOY_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Install dependencies
        run: uv sync --dev || uv sync

      - name: Export MYPYPATH for local stubs
        run: echo "MYPYPATH=${{ github.workspace }}/stubs" >> $GITHUB_ENV

      - name: Ruff lint
        run: uv run ruff check app tests

      - name: Ruff format check
        run: uv run ruff format --check app tests

      # - name: Mypy type check
      #   env:
      #     MYPYPATH: ${{ github.workspace }}/stubs
      #   run: uv run mypy --config-file pyproject.toml app tests

      # - name: Bandit security scan
      #   run: uv run bandit -r app -x tests

      # - name: Detect secrets baseline scan
      #   run: uv run detect-secrets-hook --baseline .secrets.baseline

      # - name: Run unit and integration tests (with coverage)
      #   run: uv run pytest -q --cov=app --cov-report=term-missing --cov-fail-under=70

      # - name: Run pre-commit
      #   uses: pre-commit/action@v3.0.1
      #   with:
      #     extra_args: "--all-files"

  deploy-docs:
    name: Deploy Documentation
    needs: checks
    # Deploy on pushes to main
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Configure Git Credentials
        run: |
          git config --global user.name "CI-Semantic-Release-Bot[bot]"
          git config --global user.email "CI-Semantic-Release-Bot[bot]@users.noreply.github.com"

      - name: Install MkDocs Dependencies
        # We use 'uv pip' to install into the ephemeral environment for speed
        run: |
          uv venv
          uv pip install mkdocs-material
          uv pip install mkdocs-awesome-pages-plugin

      - name: Deploy Docs
        run: uv run mkdocs gh-deploy --force


  call-release:
    name: Call Release workflow
    needs: checks
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    uses: ./.github/workflows/release.yml
    with:
      head_branch: ${{ github.event.pull_request.head.ref || github.ref_name }}
      base_ref: ${{ github.event.pull_request.base.ref || '' }}
      is_pr: ${{ github.event_name == 'pull_request' }}
      repo: ${{ github.repository }}
      sha: ${{ github.sha }}
    secrets:
      APP_ID: ${{ secrets.APP_ID }}
      APP_PRIVATE_KEY_B64: ${{ secrets.APP_PRIVATE_KEY_B64 }}
      DEPLOY_URL: ${{ secrets.DEPLOY_URL }}
