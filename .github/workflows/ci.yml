name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

permissions:
  contents: read
  packages: write

jobs:
  checks:
    name: Lint, Typecheck, Security & Tests
    runs-on: ubuntu-latest
    outputs:
      app_token: ${{ steps.create_app_token.outputs.token }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Install dependencies (including dev)
        # Try to install dev dependencies via uv. If the local uv setup does not support
        # a `--dev` flag, fall back to plain `uv sync` which will install declared groups.
        run: |
          set -e
          if uv --version >/dev/null 2>&1; then
            # prefer explicit dev install if available
            uv sync --dev || uv sync || python -m pip install -r ci-dev-requirements.txt || true
          else
            python -m pip install -r ci-dev-requirements.txt || true
          fi

      - name: Export MYPYPATH for local stubs
        # Ensure mypy can find local stub packages in `stubs/`
        run: echo "MYPYPATH=${{ github.workspace }}/stubs" >> $GITHUB_ENV

      - name: Ruff lint
        run: uv run ruff check app tests

      - name: Ruff format check
        run: uv run ruff format --check app tests

      - name: Mypy type check (full)
        env:
          MYPYPATH: ${{ github.workspace }}/stubs
        run: uv run mypy --config-file pyproject.toml app tests

      - name: Bandit security scan (exclude tests)
        run: uv run bandit -r app -x tests

      - name: Detect secrets baseline scan
        run: uv run detect-secrets-hook --baseline .secrets.baseline

      - name: Run unit and integration tests (with coverage)
        run: uv run pytest -q --cov=app --cov-report=term-missing --cov-fail-under=70

      - name: Run pre-commit (safety check)
        run: |
          pip install pre-commit
          pre-commit run --all-files

      - name: Create GitHub App installation token (non-PR)
        id: create_app_token
        if: ${{ github.event_name != 'pull_request' }}
        env:
          APP_ID: ${{ secrets.APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          # If App secrets are not provided, emit empty output
          if [ -z "${APP_ID:-}" ] || [ -z "${APP_PRIVATE_KEY:-}" ]; then
            echo "No APP_ID/APP_PRIVATE_KEY configured; skipping App token creation"
            echo "token=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          printf "%s\n" "$APP_PRIVATE_KEY" > /tmp/app.pem
          chmod 600 /tmp/app.pem

          now=$(date +%s)
          iat=$((now - 60))
          exp=$((now + 600))

          header='{"alg":"RS256","typ":"JWT"}'
          payload=$(printf '{"iat":%d,"exp":%d,"iss":%s}' "$iat" "$exp" "$APP_ID")

          b64url() {
            openssl base64 -e | tr -d '\n' | tr '+/' '-_' | tr -d '='
          }

          hdr_b64=$(printf '%s' "$header" | b64url)
          pay_b64=$(printf '%s' "$payload" | b64url)
          signing_input="$hdr_b64.$pay_b64"
          sig=$(printf '%s' "$signing_input" | openssl dgst -sha256 -sign /tmp/app.pem | openssl base64 -A | tr '+/' '-_' | tr -d '=')
          jwt="$signing_input.$sig"

          install_info=$(curl -s -H "Authorization: Bearer $jwt" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/$REPO/installation")
          install_id=$(printf '%s' "$install_info" | jq -r '.id')

          if [ "$install_id" = "null" ] || [ -z "$install_id" ]; then
            echo "Could not get installation id; installation info: $install_info"
            echo "token=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          token_resp=$(curl -s -X POST -H "Authorization: Bearer $jwt" -H "Accept: application/vnd.github+json" "https://api.github.com/app/installations/$install_id/access_tokens")
          access_token=$(printf '%s' "$token_resp" | jq -r '.token')

          if [ -z "$access_token" ] || [ "$access_token" = "null" ]; then
            echo "Failed to create installation token: $token_resp"
            echo "token=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "token=$access_token" >> "$GITHUB_OUTPUT"

  call-release:
    name: Call Release workflow
    needs: checks
    uses: ./.github/workflows/release.yml
    permissions:
      contents: write
      packages: write
    with:
      head_branch: ${{ github.event.pull_request.head.ref || github.ref_name }}
      base_ref: ${{ github.event.pull_request.base.ref || '' }}
      is_pr: ${{ github.event_name == 'pull_request' }}
      repo: ${{ github.repository }}
      sha: ${{ github.sha }}
      token_source: ${{ github.event_name != 'pull_request' && (needs.checks.outputs.app_token != '' && 'app' || 'workflow') || 'none' }}
    secrets:
      # Prefer App installation token created in the checks job (only for non-PR). Fallback to workflow GITHUB_TOKEN for non-PR; empty for PRs.
      RELEASE_GITHUB_TOKEN: "${{ github.event_name != 'pull_request' && (needs.checks.outputs.app_token != '' && needs.checks.outputs.app_token || secrets.GITHUB_TOKEN) || '' }}"
