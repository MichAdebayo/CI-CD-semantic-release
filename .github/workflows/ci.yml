name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  checks:
    name: Lint, Typecheck, Security & Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Install dependencies
        run: uv sync

      - name: Ruff lint
        run: uv run ruff check app tests

      - name: Ruff format check
        run: uv run ruff format --check app tests

      - name: Mypy type check
        run: uv run mypy app

      - name: Bandit security scan
        run: uv run bandit -r app/

      - name: Detect secrets baseline scan
        run: |
          uv run detect-secrets scan --update-baseline .secrets.baseline
          uv run detect-secrets audit --baseline .secrets.baseline || true

      - name: Run unit and integration tests
        run: uv run pytest -q

      - name: Run pre-commit (safety check)
        run: |
          pip install pre-commit
          pre-commit run --all-files
